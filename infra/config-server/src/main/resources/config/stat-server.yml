server:
  port: 0

spring:
  application:
    name: stat-server
  datasource:
    url: jdbc:postgresql://localhost:5432/ewm_stats_db
    username: postgres
    password:
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true