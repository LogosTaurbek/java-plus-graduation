server:
  port: 0

spring:
  application:
    name: main-service
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/ewm_main_db
    username: postgres
    password: "postgres"
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: always
      continue-on-error: true
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true